server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Auth Service
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**

            # Patient Service
            - id: patient-service
              uri: http://patient-service:8082
              predicates:
                - Path=/api/patients/**

            # Doctor Service
            - id: doctor-service
              uri: http://doctor-service:8083
              predicates:
                - Path=/doctors/**

            # Appointment Service
            - id: appointment-service
              uri: http://appointment-service:8084
              predicates:
                - Path=/appointments/**

            # Medical Record Service
            # Medical Record Service
            - id: medical-record-service
              uri: http://medical-record-service:8085
              predicates:
                - Path=/api/medical-records/**
              filters:
                - StripPrefix=1


# Billing Service
            - id: billing-service
              uri: http://billing-service:8086
              predicates:
                - Path=/api/billing/**
              filters:
                - StripPrefix=1
            # Notification Service (FastAPI)
            - id: notification-service
              uri: http://notification-service:8000
              predicates:
                - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      enabled: true