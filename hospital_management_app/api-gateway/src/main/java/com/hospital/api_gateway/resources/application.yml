debug: true
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: patient-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/patients/**

        - id: doctor-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/doctors/**

        - id: appointment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/appointments/**

        - id: medical-record-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/medical-records/**

        - id: billing-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/billing/**

        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: "*"