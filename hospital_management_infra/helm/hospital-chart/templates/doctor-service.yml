apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  labels:
    app: doctor-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: doctor-service

  template:
    metadata:
      labels:
        app: doctor-service

    spec:
      containers:

        - name: doctor-service

          image: "{{ .Values.registry }}/{{ index .Values.services "doctor-service" "image" }}:{{ index .Values.services "doctor-service" "tag" }}"

          ports:
            - containerPort: {{ index .Values.services "doctor-service" "port" }}

          envFrom:
            - secretRef:
                name: hospital-db-secret

---

apiVersion: v1
kind: Service
metadata:
  name: doctor-service

spec:
  selector:
    app: doctor-service

  ports:
    - port: {{ index .Values.services "doctor-service" "port" }}
      targetPort: {{ index .Values.services "doctor-service" "port" }}

  type: ClusterIP