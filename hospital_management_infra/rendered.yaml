# Source: hospital-chart/templates/api-gateway.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:

        - name: api-gateway

          image: "897355252117.dkr.ecr.ap-south-1.amazonaws.com/api-gateway:v3"

          ports:
            - containerPort: 8080

          envFrom:
            - secretRef:
                name: hospital-db-secret
