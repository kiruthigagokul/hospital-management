# Source: hospital-chart/templates/mysql.yml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql

spec:

  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:

    metadata:
      labels:
        app: mysql

    spec:

      containers:

      - name: mysql

        image: "mysql:8.0"

        ports:

        - containerPort: 3306

        env:

        - name: MYSQL_ROOT_PASSWORD
          valueFrom:

            secretKeyRef:

              name: hospital-db-secret

              key: MYSQL_ROOT_PASSWORD

        - name: MYSQL_DATABASE
          value: "hospitaldb"

        volumeMounts:

        - name: mysql-storage
          mountPath: /var/lib/mysql


      volumes:

      - name: mysql-storage

        emptyDir: {}
