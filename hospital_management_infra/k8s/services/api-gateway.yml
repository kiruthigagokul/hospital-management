apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hospital

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
      - name: api-gateway

        image: 897355252117.dkr.ecr.ap-south-1.amazonaws.com/api-gateway:v2

        ports:
        - containerPort: 8080


---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hospital

spec:
  type: LoadBalancer

  selector:
    app: api-gateway

  ports:
  - port: 80
    targetPort: 8080