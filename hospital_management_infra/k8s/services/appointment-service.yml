apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: hospital

spec:
  replicas: 1

  selector:
    matchLabels:
      app: appointment-service

  template:
    metadata:
      labels:
        app: appointment-service

    spec:
      containers:
      - name: appointment-service
        image: 897355252117.dkr.ecr.ap-south-1.amazonaws.com/appointment-service:v1

        ports:
        - containerPort: 8084

        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:mysql://mysql:3306/hospital

        - name: SPRING_DATASOURCE_USERNAME
          value: root

        - name: SPRING_DATASOURCE_PASSWORD
          value: root


---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: hospital

spec:
  selector:
    app: appointment-service

  ports:
  - port: 8084
    targetPort: 8084